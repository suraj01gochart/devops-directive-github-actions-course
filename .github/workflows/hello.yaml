name: "variable hops"

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-22.04
    outputs: 
      foo: ${{ steps.step1.outputs.foo  }}
    steps:
      - name: step1
        id: step1
        run: |
          foo=bar
          echo "FOO=${foo}" >> "$GITHUB_OUTPUT"

  job2:
    runs-on: ubuntu-22.04
    needs: job1
    steps:
      - name: step1
        run: |
          echo ${{  needs.job1.outputs.foo  }}